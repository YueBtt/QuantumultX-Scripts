<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZComplete 账号极速注册</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 32px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; background: linear-gradient(135deg, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 24px; line-height: 1.5; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        input { width: 100%; padding: 12px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #8b5cf6; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transition: opacity 0.2s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; display: none; }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }
        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
    </style>
</head>
<body>
    <div class="card">
        <h2>EZComplete 极速注册</h2>
        <p class="subtitle">直连 Supabase 云端总线<br>未越狱设备免装 App 即可开户</p>
        
        <div class="input-group">
            <label>注册邮箱</label>
            <input type="email" id="email" placeholder="输入常用真实邮箱 (接收激活信)" required>
        </div>

        <div class="input-group">
            <label>设置密码</label>
            <input type="password" id="password" placeholder="建议 6 位以上英文字符/数字" required>
        </div>

        <button id="btn" onclick="handleRegister()">立即注册账号</button>

        <div id="alertBox" class="alert"></div>
    </div>

    <script>
        async function handleRegister() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("btn");
            const alertBox = document.getElementById("alertBox");

            if (!email || !password) {
                showAlert("请输入完整的邮箱和密码！", false);
                return;
            }

            btn.disabled = true;
            btn.innerText = "正在注册...";
            alertBox.style.display = "none";

            try {
                const resp = await fetch("https://spuoimtqofhbdzosrbng.supabase.co/auth/v1/signup", {
                    method: "POST",
                    headers: {
                        "apikey": "sb_publishable_AzEVhLuIj1nSMwZvIgKw7A__Y3Ghdtl",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await resp.json();

                if (resp.ok) {
                    showAlert("🎉 注册请求已成功提交！<br>官方已向你的邮箱发送了<b>激活验证邮件</b>。<br>⚠️ <b>必须前往邮箱点击确认链接</b>后才能登录与领币！", true);
                } else {
                    showAlert("❌ 注册失败: " + (data.msg || data.message || JSON.stringify(data)), false);
                }
            } catch (err) {
                showAlert("⚠️ 网络连接错误: " + err, false);
            } finally {
                btn.disabled = false;
                btn.innerText = "立即注册账号";
            }
        }

        function showAlert(msg, isSuccess) {
            const alertBox = document.getElementById("alertBox");
            alertBox.className = "alert " + (isSuccess ? "alert-success" : "alert-error");
            alertBox.innerHTML = msg;
            alertBox.style.display = "block";
        }
    </script>
</body>
</html>
